# Pushing a tag like v0.3.3 builds NicoClient and publishes it as a GitHub release.
# Installed launchers then find the new version on their own.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build the Fabric mod
        working-directory: fabric-mod
        shell: bash
        run: |
          # A slow build is fine. Only 15 minutes without any new output counts as stuck.
          # The reason goes in the run's annotations, which can be read without signing in.
          report() {
            tail -n 25 gradle.log | cut -c1-200 | sed -e 's/%/%25/g' | tr '\n' '~' | sed -e 's/~/%0A/g' > report.txt
            echo "::error::$1%0A$(cat report.txt)"
          }
          gradle build --no-daemon --console=plain --info < /dev/null > gradle.log 2>&1 &
          pid=$!
          last=0
          idle=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 60
            size=$(wc -c < gradle.log)
            if [ "$size" = "$last" ]; then idle=$((idle + 1)); else idle=0; fi
            last=$size
            echo "Gradle output: $size bytes, idle for $idle minutes"
            if [ "$idle" -ge 15 ]; then
              report "Gradle was stuck for 15 minutes. Last output:"
              kill "$pid"
              exit 1
            fi
          done
          status=0
          wait "$pid" || status=$?
          if [ "$status" -ne 0 ]; then
            report "Gradle failed. Last output:"
            exit 1
          fi

      # Electron and the installer tools come from GitHub release downloads, which sometimes fail for a while.
      # The Actions cache keeps them between releases, and the build is retried before giving up.
      - name: Cache Electron and installer tools
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-tools-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-tools-

      # The tests never start Electron, and the installer build gets its own copy, so npm skips that download.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

      - name: Build the installer
        shell: bash
        run: |
          npm run build
          for attempt in 1 2 3 4 5; do
            if npx electron-builder --win nsis --publish never; then exit 0; fi
            echo "::warning::Installer build attempt $attempt failed, probably a download. Trying again."
            sleep $((attempt * 60))
          done
          echo "::error::The installer could not be built after 5 attempts."
          exit 1

      # One command with all files, so uploads cannot race and create duplicate releases.
      - name: Publish the release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/NicoClient-Setup-$version.exe" \
            "release/NicoClient-Setup-$version.exe.blockmap" \
            release/latest.yml \
            --verify-tag --latest --title "NicoClient $version" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
