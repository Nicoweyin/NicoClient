# Pushing a tag like v0.3.3 builds NicoClient and publishes it as a GitHub release.
# Installed launchers then find the new version on their own.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build the Fabric mod
        working-directory: fabric-mod
        shell: bash
        run: |
          # Show the reason in the run's summary, which can be read without signing in.
          if ! gradle build --console=plain 2>&1 | tee gradle.log; [ "${PIPESTATUS[0]}" -ne 0 ]; then :; fi
          if [ "${PIPESTATUS[0]:-0}" -ne 0 ] || ! grep -q 'BUILD SUCCESSFUL' gradle.log; then
            reason="$(grep -A6 'What went wrong' gradle.log | tr '\n' ' ' | cut -c1-600)"
            echo "::error::${reason:-Gradle failed}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish the installer
        run: npm run build && npx electron-builder --win nsis --publish always
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the release notes
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --title "NicoClient ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
