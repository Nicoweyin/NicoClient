# Pushing a tag like v0.3.3 builds NicoClient and publishes it as a GitHub release.
# Installed launchers then find the new version on their own.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build the Fabric mod
        working-directory: fabric-mod
        shell: bash
        run: |
          # A slow build is fine. Only 15 minutes without any new output counts as stuck.
          # The reason goes in the run's annotations, which can be read without signing in.
          report() {
            tail -n 25 gradle.log | cut -c1-200 | sed -e 's/%/%25/g' | tr '\n' '~' | sed -e 's/~/%0A/g' > report.txt
            echo "::error::$1%0A$(cat report.txt)"
          }
          gradle build --no-daemon --console=plain --info < /dev/null > gradle.log 2>&1 &
          pid=$!
          last=0
          idle=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 60
            size=$(wc -c < gradle.log)
            if [ "$size" = "$last" ]; then idle=$((idle + 1)); else idle=0; fi
            last=$size
            echo "Gradle output: $size bytes, idle for $idle minutes"
            if [ "$idle" -ge 15 ]; then
              report "Gradle was stuck for 15 minutes. Last output:"
              kill "$pid"
              exit 1
            fi
          done
          status=0
          wait "$pid" || status=$?
          if [ "$status" -ne 0 ]; then
            report "Gradle failed. Last output:"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish the installer
        run: npm run build && npx electron-builder --win nsis --publish always
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the release notes
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --title "NicoClient ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
